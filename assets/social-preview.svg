<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1714"/>
      <stop offset="1" stop-color="#0e0d0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- left: wordmark -->
  <g font-family="JetBrainsMono NF, JetBrains Mono, monospace">
    <rect x="96" y="150" width="214" height="40" rx="20" fill="#d97757" fill-opacity="0.14" stroke="#d97757" stroke-opacity="0.5"/>
    <text x="204" y="177" text-anchor="middle" font-size="18" fill="#f0a283" letter-spacing="2">FOR CLAUDE CODE</text>
  </g>
  <text x="92" y="300" font-family="Adwaita Sans, Noto Sans, sans-serif" font-size="94" font-weight="800" fill="#f5efe8" letter-spacing="-4">claude<tspan fill="#d97757">-</tspan>mods</text>
  <text x="96" y="364" font-family="Adwaita Sans, Noto Sans, sans-serif" font-size="32" fill="#b9aea3">Open-source mods that reshape</text>
  <text x="96" y="406" font-family="Adwaita Sans, Noto Sans, sans-serif" font-size="32" fill="#b9aea3">your Claude Code sessions.</text>

  <g font-family="JetBrainsMono NF, JetBrains Mono, monospace" font-size="20" fill="#8a8178">
    <text x="96" y="500">panes · status lines · toasts · tool guards · commands</text>
  </g>

  <!-- right: terminal window -->
  <g transform="translate(760 150)">
    <rect x="0" y="0" width="440" height="340" rx="18" fill="#0b0a09" stroke="#3a332d" stroke-width="2"/>
    <rect x="0" y="0" width="440" height="46" rx="18" fill="#1f1b18"/>
    <rect x="0" y="28" width="440" height="18" fill="#1f1b18"/>
    <circle cx="28" cy="23" r="7" fill="#ff5f57"/>
    <circle cx="52" cy="23" r="7" fill="#febc2e"/>
    <circle cx="76" cy="23" r="7" fill="#28c840"/>
    <g font-family="JetBrainsMono NF, JetBrains Mono, monospace" font-size="17">
      <text x="26" y="92" fill="#d97757">&gt;</text>
      <text x="46" y="92" fill="#f5efe8">/plugin marketplace add</text>
      <text x="46" y="118" fill="#f0a283">ibrahimkobeissy/claude-mods</text>
      <text x="26" y="160" fill="#28c840">✓</text>
      <text x="46" y="160" fill="#b9aea3">marketplace added</text>
      <text x="26" y="202" fill="#d97757">&gt;</text>
      <text x="46" y="202" fill="#f5efe8">/plugin install</text>
      <text x="46" y="228" fill="#f0a283">&lt;mod&gt;@claude-mods</text>
      <text x="26" y="270" fill="#28c840">✓</text>
      <text x="46" y="270" fill="#b9aea3">mod loaded · hot reload on</text>
      <rect x="26" y="292" width="11" height="22" fill="#d97757"/>
    </g>
  </g>

  <rect x="0" y="632" width="1280" height="8" fill="#d97757"/>
</svg>
